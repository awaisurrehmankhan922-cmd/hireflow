# Single entry point (target for Cloudflare Tunnel):
#   /        React dashboard
#   /api/    FastAPI backend
#   /ai/     Open WebUI, only reachable after dashboard login (auth_request)
# Docker's internal DNS, resolved per request: the gateway starts even when
# Open WebUI (or the API) is down, so the dashboard never depends on Open WebUI.
resolver 127.0.0.11 valid=30s ipv6=off;

server {
    listen 80;
    set $api_upstream http://api:8000;
    set $webui_upstream http://open-webui:8080;
    client_max_body_size 20m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;   # allows embedding Open WebUI in our own dashboard only

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }

    location = /_auth {
        internal;
        proxy_pass $api_upstream/api/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    location /ai/ {
        auth_request /_auth;
        auth_request_set $hf_email $upstream_http_x_user_email;
        auth_request_set $hf_name  $upstream_http_x_user_name;
        error_page 401 = @login;
        error_page 502 504 = @webui_down;
        proxy_set_header X-User-Email $hf_email;   # overwrite any client-supplied value
        proxy_set_header X-User-Name  $hf_name;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;     # websockets for streaming chat
        proxy_set_header Connection "upgrade";
        rewrite ^/ai/(.*)$ /$1 break;
        proxy_pass $webui_upstream;
    }

    location @login { return 302 /; }
    location @webui_down { default_type text/html; return 503 '<p style="font-family:sans-serif;padding:2em">Open WebUI is not running. The recruitment platform is unaffected.</p>'; }
}
